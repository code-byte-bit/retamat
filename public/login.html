<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RETAMAT · Iniciar sesión</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5fc;color:#192b49;font:16px/1.6 Arial,sans-serif;padding:44px 18px}main{max-width:560px;margin:auto;background:white;border:1px solid #dee6f4;border-radius:24px;padding:32px;box-shadow:0 14px 45px #203c7010}header{color:#365de0;font-weight:bold;letter-spacing:2px;font-size:14px}h1{font-size:30px;line-height:1.2}label{display:block;font-weight:bold;margin-top:20px}input,button{font:inherit;width:100%;padding:13px;border-radius:10px;border:1px solid #8b9ab1}button{margin-top:24px;background:#365de0;border:0;color:white;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#284cc4}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #9477ee;outline-offset:3px}.note{color:#546681;font-size:14px}#status{white-space:pre-wrap;overflow-wrap:anywhere}#status[data-state=error]{color:#a92336}dl{background:#f2f5fc;padding:20px;border-radius:12px}dt{font-size:13px;font-weight:bold;color:#546681}dd{margin:0 0 14px;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:420px){body{padding:20px 12px}main{padding:24px}}</style></head><body><main><header>RETAMAT</header><h1>Bienvenido de nuevo</h1><p>Entra con la cuenta que registraste en MySQL.</p><form id="login"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required maxlength="150" autocomplete="username"><label for="password">Contraseña</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password"><button id="send" type="submit">Iniciar sesión</button></form><p id="status" role="status" aria-live="polite"></p><p>¿Aún no tienes cuenta? <a href="/registro">Crear cuenta</a></p><p class="note">Usa la contraseña elegida al registrarte. Las cuentas de demostración de la app anterior no se importan automáticamente.</p></main><script>
const form=document.getElementById('login'),button=document.getElementById('send'),status=document.getElementById('status');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.dataset.state='';status.textContent='Verificando tu cuenta…';
 try {
  const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});
  const result=await response.json();
  if(!response.ok)throw Error(result.mensaje || 'No se pudo iniciar sesión.');
  window.location.assign(result.user.role==='student'?'/aula':result.user.role==='teacher'?'/docente':'/admin');
 }catch(error){status.dataset.state='error';status.textContent=error.message==='Failed to fetch'?'No se pudo contactar al servidor. Comprueba que siga ejecutándose.':error.message;}
 finally{button.disabled=false;}
});
</script></body></html>
